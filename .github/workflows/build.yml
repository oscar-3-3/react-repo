name: Build

on:
  push:
    branches: [main]
    paths:
      - "my-app/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "my-app/**"
      - ".github/workflows/build.yml"

defaults:
  run:
    working-directory: my-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Build failed* on `${{ github.repository }}` (${{ github.ref_name }})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> - triggered by ${{ github.actor }}"
            }