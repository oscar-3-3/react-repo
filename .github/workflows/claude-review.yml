name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "my-app/**"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a Next.js application located in the `my-app/` directory.

            Please review this pull request with a focus on:
            - Code quality and React/Next.js best practices
            - Potential bugs or logic issues
            - Security implications (XSS, SSRF, unsafe data handling, etc.)
            - Performance considerations (unnecessary re-renders, bundle size, server/client boundaries)
            - TypeScript type safety

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as chat messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
