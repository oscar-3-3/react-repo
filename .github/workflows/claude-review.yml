name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "my-app/**"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a Next.js application located in the `my-app/` directory.

            Please review this pull request with a focus on:
            - Code quality and React/Next.js best practices
            - Potential bugs or logic issues
            - Security implications (XSS, SSRF, unsafe data handling, etc.)
            - Performance considerations (unnecessary re-renders, bundle size, server/client boundaries)
            - TypeScript type safety

            Note: The PR branch is already checked out in the current working directory.

            IMPORTANT - avoid duplicate feedback:
            Before posting anything, check what has already been reviewed on this PR:
            - Run `gh pr view ${{ github.event.pull_request.number }} --json comments,reviews` to see prior top-level comments and reviews.
            - Run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` to see prior inline review comments.
            Do not repeat feedback about an issue that was already flagged in a previous comment/review and is still unresolved in the code - skip it. Only comment on issues that are genuinely new: introduced or changed since the last review, or not previously mentioned. If there is nothing new to report, do not post a comment at all.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as chat messages.

            Finally, report back truthfully whether you posted any new feedback in this run, how many comments you posted, and a one-sentence summary.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)" --json-schema '{"type":"object","properties":{"posted_feedback":{"type":"boolean"},"comment_count":{"type":"number"},"summary":{"type":"string"}},"required":["posted_feedback","summary"]}'

      - name: Notify Slack on new feedback
        if: fromJSON(steps.review.outputs.structured_output).posted_feedback == true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR_COMMENTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Claude reviewed PR #${{ github.event.pull_request.number }}* on `${{ github.repository }}`\n${{ fromJSON(steps.review.outputs.structured_output).summary }}\n<${{ github.event.pull_request.html_url }}|View PR>"
            }
